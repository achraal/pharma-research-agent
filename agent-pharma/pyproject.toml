[project]
name = "agent-pharma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "achraal", email = "achrafbenagri28@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.5",
    "langgraph>=1.2.21",
    "langgraph-checkpoint>=4.3.1",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-pharma = "agent_pharma:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false